version: '3'
services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env

  rails:
    <<: *base
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV}
      - RAILS_ENV=${RAILS_ENV}
      - INSTALLATION_ENV=${INSTALLATION_ENV}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sidekiq:
    <<: *base
    environment:
      - NODE_ENV=${NODE_ENV}
      - RAILS_ENV=${RAILS_ENV}
      - INSTALLATION_ENV=${INSTALLATION_ENV}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
